<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מאגר שאלות - ניהול תשתיות גלובליות + ניהול מתקנים (FM)</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --accent2:#22c55e;
    --danger:#ef4444; --text:#f1f5f9; --muted:#94a3b8; --border:#334155;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI', Arial, sans-serif;background:linear-gradient(160deg,#0f172a,#1e293b);color:var(--text);min-height:100vh;padding:20px;}
  .wrap{max-width:740px;margin:0 auto;}
  h1{font-size:1.35rem;text-align:center;margin-bottom:4px;}
  .subtitle{text-align:center;color:var(--muted);font-size:0.85rem;margin-bottom:20px;}
  .setup{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
  .setup h2{margin-top:0;font-size:1.02rem;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:#0f172a;color:var(--muted);cursor:pointer;font-size:0.82rem;user-select:none;transition:.15s;}
  .chip.active{background:var(--accent);color:#03202f;border-color:var(--accent);font-weight:600;}
  .allbtns{display:flex;gap:8px;margin-bottom:10px;}
  .smallbtn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:0.78rem;cursor:pointer;}
  .startbtn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--accent2);color:#04240f;font-weight:700;font-size:1rem;cursor:pointer;}
  .startbtn:hover{filter:brightness(1.07);}
  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:0.85rem;}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;}
  .tag{display:inline-block;font-size:0.72rem;color:var(--accent);background:rgba(56,189,248,0.12);padding:3px 10px;border-radius:999px;margin-bottom:10px;}
  .qtext{font-size:1.05rem;line-height:1.5;margin-bottom:18px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{text-align:right;padding:13px 15px;border-radius:12px;border:1px solid var(--border);background:#0f172a;color:var(--text);cursor:pointer;font-size:0.95rem;line-height:1.4;transition:.15s;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:rgba(34,197,94,0.18);border-color:var(--accent2);color:#c8ffe0;}
  .opt.wrong{background:rgba(239,68,68,0.18);border-color:var(--danger);color:#ffd6d6;}
  .opt.disabled{cursor:default;}
  .feedback{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:0.88rem;display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:rgba(34,197,94,0.12);color:#a9f5c9;}
  .feedback.bad{background:rgba(239,68,68,0.12);color:#ffc9c9;}
  .navrow{display:flex;gap:10px;margin-top:18px;}
  .navbtn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-size:0.93rem;}
  .nextbtn{background:var(--accent);color:#03202f;}
  .nextbtn:disabled{opacity:0.35;cursor:not-allowed;}
  .quitbtn{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .hidden{display:none !important;}
  .result{text-align:center;padding:30px 20px;}
  .result .score{font-size:2.6rem;font-weight:800;color:var(--accent2);margin:10px 0;}
  .result p{color:var(--muted);}
  .restartbtn{margin-top:18px;padding:12px 26px;border:none;border-radius:12px;background:var(--accent);color:#03202f;font-weight:700;cursor:pointer;}
  .chbreak{width:100%;height:0;}
  .count{color:var(--muted);font-size:0.78rem;margin-bottom:6px;}
</style>

<style id="mobile-responsive">

html, body { max-width: 100%; overflow-x: hidden; }
body { margin: 0; }
button, input, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  body {
    font-size: 16px;
    padding: 8px !important;
  }

  .container, .wrapper, .app, main {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 auto !important;
  }

  header, .header, .topbar {
    padding: 12px !important;
  }

  h1 { font-size: 22px !important; line-height: 1.25 !important; }
  h2 { font-size: 19px !important; }
  h3 { font-size: 17px !important; }

  /* לשוניות/פרקים – גלילה אופקית במקום שבירה */
  #chapterChips {
    display: flex !important;
    flex-wrap: nowrap !important;
    overflow-x: auto !important;

    gap: 7px !important;

  }

  /* אזור השאלה */
  #qText, .question, .question-text {
    font-size: 19px !important;

    overflow-wrap: anywhere;
  }

  /* תשובות – כפתורים גדולים ונוחים למגע */
  #optionsBox {
    display: flex !important;
    flex-direction: column !important;
    gap: 10px !important;
  }
  #optionsBox .opt {
    width: 100% !important;
    min-height: 54px !important;
    padding: 13px 14px !important;
    text-align: right !important;
    font-size: 16px !important;
    line-height: 1.45 !important;
    white-space: normal !important;
    overflow-wrap: anywhere !important;
  }

  /* ניווט */
  .navrow, #navButtons {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 8px !important;
    width: 100% !important;

  .navrow button, #navButtons button {
    flex: 1 1 45% !important;
    min-height: 48px !important;
    font-size: 15px !important;
  }

  /* כרטיסי מידע */
  .card, .panel, .quiz-card, section {

    overflow: hidden;
  }

  /* מסכי הגדרות/תוצאות */
  input, select {
    width: 100% !important;

  }

  table {
    display: block !important;
    max-width: 100% !important;
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch;
  }

  .feedback {
    font-size: 16px !important;
    line-height: 1.45 !important;
  }
}

/* מכשירים צרים במיוחד */
@media (max-width: 390px) {
  body { padding: 5px !important; }
  #qText, .question, .question-text { font-size: 18px !important; }
  #optionsBox .opt { font-size: 15px !important; min-height: 52px !important; }
  .navrow button, #navButtons button { font-size: 14px !important; }
}
</style>

</head>
<body>
<div class="wrap">
  <h1>📘 מאגר שאלות - ניהול תשתיות גלובליות + ניהול מתקנים</h1>
  <div class="subtitle">פרקים 1-10 (מר' אלי אהרוני, בר-אילן) + נספחי TFM (Atkin &amp; Brooks) ו-Facility Management Handbook (Cotts)</div>

  <div class="setup" id="setup">
    <h2>בחר/י פרקים לתרגול</h2>
    <div class="allbtns">
      <button class="smallbtn" id="selAll">בחר הכל</button>
      <button class="smallbtn" id="selNone">נקה הכל</button>
    </div>
    <div class="chips" id="chapterChips"></div>
    <div class="count" id="poolCount"></div>
    <h2 style="margin-top:16px;">מספר שאלות בתרגול</h2>
    <div class="chips" id="countChips">
      <div class="chip" data-count="15">15</div>
      <div class="chip active" data-count="30">30</div>
      <div class="chip" data-count="50">50</div>
      <div class="chip" data-count="0">כל הזמינות</div>
    </div>
    <button class="startbtn" id="startBtn">התחל תרגול 🚀</button>
  </div>

  <div id="quizArea" class="hidden">
    <div class="progress-row">
      <span id="progressText">שאלה 1</span>
      <span id="scoreText">ניקוד: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="card">
      <div class="tag" id="qTag"></div>
      <div class="qtext" id="qText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback" id="feedback"></div>
      <div class="navrow">
        <button class="navbtn" id="prevBtn" disabled>→ שאלה קודמת</button>
        <button class="navbtn quitbtn" id="quitBtn">סיים ובדוק ציון</button>
        <button class="navbtn nextbtn" id="nextBtn" disabled>הבא ←</button>
      </div>
    </div>
  </div>

  <div id="resultArea" class="card result hidden">
    <div>סיימת את התרגול!</div>
    <div class="score" id="finalScore">0/0</div>
    <p id="finalMsg"></p>
    <button class="restartbtn" id="restartBtn">תרגול חדש</button>
  </div>
</div>

<script>
/* ===================== QUESTION BANK (כולל 40 שאלות חכמות חדשות מהמקראות) ===================== */
const QUESTIONS = [];
function add(ch, q, opts, correct){ QUESTIONS.push({ch,q,opts,correct}); }

/* ---------- CHAPTER 1: סקירה כללית - ניהול תשתיות גלובליות ---------- */
const CH1 = "פרק 1 - סקירה כללית";
add(CH1,"מהי המטרה המרכזית של ניהול תשתיות (Facility Management) בארגון?",
["לאפשר למחלקות התמיכה לעמוד ביעדים עסקיים מבלי להתערב בליבת הפעילות.",
"לאפשר למנהלים לעסוק בליבת העשייה תוך הבטחת שירותים תומכים ברציפות ובמחיר סביר.",
"לנתב אחריות בין מחלקות שונות כדי להפחית התנגשות בתהליכים תפעוליים.",
"להבטיח שהשירותים החיצוניים מקבלים עדיפות בניהול התקציב התפעולי של הארגון."],1);
add(CH1,"מה מאפיין שירותים מסוג Soft Services?",
["שירותים שאינם חלק מליבת העשייה אך מאפשרים פעילות רציפה ותפקוד יומיומי של הארגון.",
"שירותים שמספקים מענה רגולטורי בלבד בהתאם לדרישות מקומיות.",
"שירותים הקשורים לתשתיות מבניות כמו חשמל, מים, מיזוג אוויר ואחזקה הנדסית.",
"שירותים שחייבים להתבצע על ידי קבלן חיצוני בשל מגבלות רגולציה פנימית."],0);
add(CH1,"מהו ההבדל בין אזור המוגדר כ-Critical לבין Non-Critical לפי עקרונות ניהול התשתיות?",
["אזור Non-Critical מתנהל באופן עצמאי ללא קשר לרציפות פעילות הארגון.",
"אזור Critical פועל תמיד במתקנים בהם קיימת תחלופת עובדים גבוהה.",
"אזור Non-Critical עוסק רק בשירותים שאין להם השפעה על מבנה הארגון או תקציבו.",
"אזור Critical משפיע ישירות על עמידה ביעדים העסקיים ודורש פתרונות לגיבוי ותמיכה."],3);
add(CH1,"מהי הסיבה לחלוקה בין שירותים מסוג Hard לבין שירותים מסוג Soft?",
["החלוקה מתבצעת רק כדי לעמוד בנהלים הקבועים על ידי משרד התחבורה והבטיחות.",
"החלוקה מאפשרת יצירת שפה משותפת ארגונית, סדר עדיפויות מותאם, והגדרה רגולטורית לפי רמת חשיבות.",
"חלוקה זו נועדה לשפר את מערך השכר של עובדים פנימיים לעומת קבלני שירות.",
"מדובר בהפרדה שנועדה להקל על קליטת עובדים חדשים לתוך מערכת השירותים הקיימת."],1);
add(CH1,"מהו היתרון של ניהול תשתיות גלובלי לפי הסקירה?",
["מאפשר יצירת בקרה רוחבית על תהליכי שיווק, רכש ומכירות בכל היחידות.",
"תומך בהפחתת סיכונים תפעוליים בעיקר עבור ארגונים הממוקמים במדינות מתפתחות.",
"מאפשר אחידות בסטנדרטים, שיפור שירות, הפחתת עלויות, ושיתוף ידע בין אתרים שונים של הארגון.",
"מסייע לייצר מבנה תקציבי אחיד עבור כל פעילויות ההנהלה בארגון המרכזי בלבד."],2);
add(CH1,"מה מאפיין אזורים או נושאים המוגדרים כ-Business to Core?",
["תחומים שאינם דורשים ניהול ייעודי אך חייבים בנהלי הפעלה פנימיים.",
"אזורים המשויכים לשירותים זמניים המוגדרים לפי פרויקט.",
"תחומים שהארגון משאיר לפיקוח של רשויות מקומיות כדי להימנע מהתערבות פנימית.",
"אזורים הקשורים ישירות לליבת הפעילות העסקית ודורשים תשומת לב תפעולית מתמדת."],3);
add(CH1,"מה מהבאים נכון לגבי אזורים המוגדרים Business to Non-Core?",
["תחומים אלה נמצאים תחת אחריות רגולטורית בינלאומית קבועה.",
"אלו אזורים שאינם חלק מליבת העשייה ולכן מקבלים תשומת לב לפי סטנדרטים תומכים בלבד.",
"אזורים אלו דורשים תמיד ניהול באמצעות מערכות סייבר מתקדמות.",
"מדובר באזורים המשויכים לפעילויות חדשנות ומחקר עתידיות בלבד."],1);
add(CH1,"מהו העיקרון שמנחה חלוקה בין אזורים Critical ו-Non-Critical?",
["חלוקה לפי דרישות תקני בטיחות בתחום הסביבתי.",
"הבחנה לפי רמת ההשפעה האפשרית על המשכיות הפעילות העסקית במקרה של תקלה.",
"חלוקה שנעשית לפי סוג חוזי ההתקשרות עם הספקים החיצוניים.",
"הבחנה בין מערכות שמשויכות לשעות הפעילות לבין כאלו שפועלות בלילה בלבד."],1);
add(CH1,"מה מאפיין את גישת ה-IFM (Integrated Facility Management)?",
["ניהול כולל של כלל שירותי התשתיות בארגון באמצעות גורם אחד חיצוני או פנימי.",
"ניהול תשתיות באמצעות פלטפורמה דיגיטלית מקומית הכוללת דוחות תפעוליים בלבד.",
"שילוב בין שני ספקים באותו אזור גיאוגרפי לביצוע שירותים עונתיים.",
"שיטה המתאימה רק לארגונים שבהם אין אפשרות להעסיק עובדים קבועים."],0);
add(CH1,"מהו יתרון של שילוב מערכות טכנולוגיות חדשות בניהול תשתיות?",
["יוצר תחלופה קבועה של מנהלי תחזוקה ומפחית עומס עבודה.",
"מחייב השקעה קבועה בציוד תקשורת ושרתי גיבוי פיזיים בכל אתר.",
"מאפשר בקרה מרחוק, מענה מבוסס צורך, ושיפור יעילות באמצעות אוטומציה ורובוטיקה.",
"משפר את תהליך השכרה של מבנים תעשייתיים על בסיס יומי."],2);
add(CH1,"מהי סיבת הבחירה בשירותים חיצוניים (Outsourcing) על פני עבודה עצמית (Insourcing)?",
["לרוב השירותים החיצוניים אינם מחייבים בקרה איכותית ולכן קל ליישם אותם לעומת עבודה עצמית.",
"השיטה מתאימה רק כאשר מחזור החיים של העסק עבר שלב צמיחה.",
"לרוב מדובר בצורך הנובע מהיעדר משאבים פנימיים או מחוסר כדאיות כלכלית לביצוע עצמי.",
"השיטה מאפשרת רישוי מהיר לשירותים תחת הגדרות רגולציה בין-מדינתית."],2);
add(CH1,"מתי יעדיף ארגון מעבר לניהול משולב (Hybrid)?",
["כאשר יש צורך בגמישות בין שירותים קריטיים לניהול פנימי לבין תפעול חיצוני עבור תשתיות משניות.",
"כאשר כלל שירותי התחזוקה כפופים לרשות מוניציפלית חיצונית.",
"כאשר הפעילות ממוקדת רק באתר אחד בגבולות המדינה ונדרשת גמישות בשירותים קריטיים.",
"כאשר עיקר המיקוד של הארגון הוא בפיתוח אסטרטגיה שיווקית ארצית."],0);
add(CH1,"מהי המשמעות של קביעת BASELINE בהתקשרות עם חברת IFM?",
["קביעה של מסגרת השכר לעובדי שירותי תשתית חיצוניים.",
"מדד פנימי להשוואת מספר תחנות עבודה לכל מחלקה בארגון.",
"קביעת נקודת ייחוס תקציבית שממנה ניתן למדוד עלויות ולבצע השוואות.",
"תיעוד זמני הפעולה של כל מערכת תחזוקה לשם ניתוח סטטיסטי."],2);
add(CH1,"מהו SLA בהקשר לניהול תשתיות?",
["מערכת דירוג שירותים לפי קטגוריה רגולטורית.",
"הסכם שירות שבו מוגדרות רמות השירות המצופות, זמני תגובה וסטנדרטים לביצוע.",
"רישיון ממשלתי לניהול תשתיות באזורים מבוקרים.",
"תוכנית בטיחות שנתית לתשתיות תפעוליות בתחומי חשמל ומיזוג לפי הסכם ידוע מראש."],1);
add(CH1,"מהי מטרת השימוש במודל Open Book?",
["לאפשר אספקת שירותים מבלי להצהיר על מרכיביהם התקציביים.",

add(CH20,"מנהל FM רוצה לשפר את השירות בלי להגדיל תקציב. מהו צעד התואם את הפילוסופיה?",["בחינת תהליכים, שיפור יעילות, אוטומציה ותכנון טוב יותר תוך שמירה על רמת השירות", "קיצוץ שירות אוטומטי", "ביטול מדדים", "הגדלת סיכון"],0);
add(CH20,"מהי המשמעות של 'תוצאות ולא כוונות' ב-Eight Big?",["הנהלה צריכה לראות השפעה ותוצאות מדידות, לא רק מאמץ", "אין צורך בדיווח", "כוונות מספיקות", "רק ספק צריך להציג תוצאות"],0);
add(CH20,"מנהל מקבל החלטה טובה אך אינו מתקשר את הערך להנהלה. מה הבעיה?",["FM שלא מקדם ומסביר את ערכו עלול שלא לקבל הכרה ומשאבים מתאימים", "אין בעיה", "התקציב יגדל אוטומטית", "הספק יעשה זאת"],0);
add(CH20,"מהי המסקנה המרכזית מהקשר בין FM לאסטרטגיית העסק?",["תוכנית FM צריכה לתמוך בתוכנית העסקית ולא לפעול כיחידה מנותקת", "FM צריך להיות עצמאי מהעסק", "רק רכש צריך אסטרטגיה", "העסק צריך להתאים עצמו ל-FM"],0);
add(CH20,"מהו מבחן מתוחכם במיוחד לבחירת פתרון FM?",["האם הפתרון משיג את מטרת העסק, מספק את השירות הנדרש, מנהל סיכונים ומייצר ערך לאורך מחזור החיים", "האם הוא הזול ביותר", "האם הספק מוכר", "האם הוא חדש"],0);

/* ===================== APP LOGIC ===================== */
let quizQuestions = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let answerState = {}; // שומרת את הבחירה בכל שאלה כדי שאפשר יהיה לשוטט קדימה ואחורה

const chapters = [...new Set(QUESTIONS.map(q=>q.ch))];
const chapterChips = document.getElementById('chapterChips');
chapters.forEach(ch=>{
  const d = document.createElement('div');
  d.className='chip active';
  const n = QUESTIONS.filter(q=>q.ch===ch).length;
  d.textContent = ch + ' (' + n + ')';
  d.dataset.chapter=ch;
  d.onclick=()=>{ d.classList.toggle('active'); updatePoolCount(); };
  chapterChips.appendChild(d);
});

function updatePoolCount(){
  const smart40 = document.getElementById('smart40Btn')?.classList.contains('active');
  const activeChapters = [...document.querySelectorAll('#chapterChips .chip.active')].map(c=>c.dataset.chapter);
  const n = smart40 ? QUESTIONS.filter(q => q.ch === CH18).length
                    : QUESTIONS.filter(q => activeChapters.includes(q.ch)).length;
  document.getElementById('poolCount').textContent = `סה"כ שאלות זמינות: ${n} מתוך ${QUESTIONS.length}`;
}
updatePoolCount();

document.getElementById('selAll').onclick = ()=>{
  document.querySelectorAll('#chapterChips .chip').forEach(c=>c.classList.add('active'));
  updatePoolCount();
};
document.getElementById('selNone').onclick = ()=>{
  document.querySelectorAll('#chapterChips .chip').forEach(c=>c.classList.remove('active'));
  updatePoolCount();
};

document.getElementById('smart40Btn')?.addEventListener('click', function(){
  this.classList.toggle('active');
  if(this.classList.contains('active')){
    document.querySelectorAll('#chapterChips .chip').forEach(c=>c.classList.remove('active'));
  } else {
    document.querySelectorAll('#chapterChips .chip').forEach(c=>c.classList.add('active'));
  }
  updatePoolCount();
});

document.querySelectorAll('#countChips .chip').forEach(c=>{
  c.onclick=()=>{
    document.querySelectorAll('#countChips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
  };
});

document.getElementById('startBtn').onclick = () => {
  const smart40 = document.getElementById('smart40Btn')?.classList.contains('active');
  const activeChapters = [...document.querySelectorAll('#chapterChips .chip.active')].map(c=>c.dataset.chapter);
  let pool = smart40
    ? QUESTIONS.filter(q => q.ch === CH18)
    : QUESTIONS.filter(q => activeChapters.includes(q.ch));
  if(pool.length===0){ alert('בחר/י לפחות פרק אחד'); return; }
  pool = shuffle([...pool]);
  const countChip = document.querySelector('#countChips .chip.active');
  const count = parseInt(countChip.dataset.count);
  quizQuestions = count>0 ? pool.slice(0,Math.min(count,pool.length)) : pool;
  currentIndex=0; score=0; answerState={};
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('quizArea').classList.remove('hidden');
  showQuestion();
};

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function showQuestion(){
  const q = quizQuestions[currentIndex];
  const saved = answerState[currentIndex];

  answered = !!saved;
  document.getElementById('qTag').textContent = q.ch;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressText').textContent = `שאלה ${currentIndex+1} מתוך ${quizQuestions.length}`;
  document.getElementById('scoreText').textContent = `ניקוד: ${score}`;
  document.getElementById('progressFill').style.width =
    `${((currentIndex+1)/quizQuestions.length)*100}%`;

  document.getElementById('prevBtn').disabled = (currentIndex === 0);

  const fb = document.getElementById('feedback');
  fb.className='feedback';
  fb.textContent='';

  const correctText = q.opts[q.correct];
  const box = document.getElementById('optionsBox');
  box.innerHTML='';

  // סדר התשובות נשמר לכל שאלה במהלך השיטוט.
  if(!q._displayOpts) q._displayOpts = shuffle(q.opts.map(t=>t));
  q._displayOpts.forEach(optText=>{
    const b = document.createElement('button');
    b.className='opt';
    b.textContent=optText;

    if(saved){
      b.classList.add('disabled');
      if(optText === correctText) b.classList.add('correct');
      if(optText === saved.selected && !saved.isCorrect) b.classList.add('wrong');
    } else {
      b.onclick=()=>selectAnswer(b, optText===correctText, correctText, optText);
    }

    box.appendChild(b);
  });

  if(saved){
    if(saved.isCorrect){
      fb.textContent='✅ תשובה נכונה!';
      fb.className='feedback show ok';
    } else {
      fb.textContent='❌ לא נכון. התשובה הנכונה מסומנת בירוק.';
      fb.className='feedback show bad';
    }
  }

  document.getElementById('nextBtn').disabled = !saved;
}

function selectAnswer(btn, isCorrect, correctText, selectedText){
  if(answered) return;
  answered=true;

  answerState[currentIndex] = {
    selected: selectedText,
    isCorrect: isCorrect
  };

  const allOpts = document.querySelectorAll('.opt');
  allOpts.forEach(o=>{
    o.classList.add('disabled');
    o.onclick=null;
    if(o.textContent===correctText) o.classList.add('correct');
  });

  if(isCorrect){
    score++;
    btn.classList.add('correct');
    const fb = document.getElementById('feedback');
    fb.textContent='✅ תשובה נכונה!';
    fb.className='feedback show ok';
  } else {
    btn.classList.add('wrong');
    const fb = document.getElementById('feedback');
    fb.textContent='❌ לא נכון. התשובה הנכונה מסומנת בירוק.';
    fb.className='feedback show bad';
  }

  document.getElementById('scoreText').textContent = `ניקוד: ${score}`;
  document.getElementById('nextBtn').disabled=false;
}

document.getElementById('nextBtn').onclick = () => {
  if(currentIndex < quizQuestions.length-1){
    currentIndex++;
    showQuestion();
  } else {
    finishQuiz();
  }
};

document.getElementById('prevBtn').onclick = () => {
  if(currentIndex > 0){
    currentIndex--;
    showQuestion();
  }
};

document.getElementById('quitBtn').onclick = () => {
  finishQuiz();
};

function finishQuiz(){
  document.getElementById('quizArea').classList.add('hidden');
  document.getElementById('resultArea').classList.remove('hidden');
  const total = Object.keys(answerState).length;
  document.getElementById('finalScore').textContent = `${score}/${total}`;
  const pct = total ? Math.round((score/total)*100) : 0;
  let msg='';
  if(pct>=90) msg='מעולה! שליטה מצוינת בחומר 🎯';
  else if(pct>=70) msg='כל הכבוד, ביצוע טוב מאוד 👏';
  else if(pct>=50) msg='לא רע, אבל כדאי לחזור על הפרקים החלשים 📖';
  else msg='מומלץ לחזור על החומר ולנסות שוב 💪';
  document.getElementById('finalMsg').textContent = msg;
}

document.getElementById('restartBtn').onclick = () => {
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
};
</script>
</body>
</html>
